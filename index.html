<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://picsum.photos/32/32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dynamic SEO handled by react-helmet-async -->

    <!-- Fonts: Inter for headings, Roboto for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#fa5c5c",
              secondary: "#fd8a6b",
              accent: "#fbef76",
              dark: "#111111",
              light: "#ffffff",
              "panel-bg": "#f8f8f8",
            },
            fontFamily: {
              sans: ["Roboto", "sans-serif"],
              heading: ["Inter", "sans-serif"],
            },
            transitionTimingFunction: {
              "out-expo": "cubic-bezier(0.19, 1, 0.22, 1)",
              "game-snap": "cubic-bezier(0.25, 1, 0.5, 1)",
            },
            backgroundImage: {
              noise:
                'url(\'data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E\')',
            },
          },
        },
      };
    </script>
    <style>
      /* Custom Utilities for 3D Flip Cards */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* HUD Corner Borders */
      .hud-corners {
        position: relative;
        clip-path: polygon(
          0 0,
          100% 0,
          100% 100%,
          0 100%,
          0 10px,
          2px 10px,
          2px 2px,
          10px 2px,
          10px 0,
          0 0 /* Top Left */
        );
      }

      /* Game UI Button Press */
      .btn-game:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      }

      /* Clean Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #111;
        border-radius: 0px;
      }

      /* Smooth reveal */
      .reveal-up {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s ease-out, transform 0.8s ease-out;
      }
      .reveal-up.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tarmizi",
        "alternateName": "Tar",
        "jobTitle": ["UI/UX Designer", "Graphic Designer", "Game Developer"],
        "url": "https://tarmizi.design/",
        "email": "mailto:tarmizilsm83@gmail.com",
        "telephone": "+6289644374314",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lhokseumawe",
          "addressCountry": "ID"
        },
        "sameAs": []
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
        }
      }
    </script>
  </head>
  <body
    class="bg-white text-dark antialiased overflow-x-hidden selection:bg-primary selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
